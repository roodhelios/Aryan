# Put this at .github/workflows/grs.yml in your profile repo: roodhelios/roodhelios
#
# Renders your stats + top-languages cards to SVG files once a day and commits
# them, styled to match your README (tokyonight, #0D1117 bg, blue accent).
# Your README points at these local files, so no third-party server can break them.

name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC daily
  workflow_dispatch:      # lets you trigger it by hand from the Actions tab

permissions:
  contents: write         # required for the commit step to push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=roodhelios&show_icons=true&hide_border=true&theme=tokyonight&bg_color=0D1117&title_color=4EA8DE&icon_color=4EA8DE&text_color=C9D1D9
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=roodhelios&layout=compact&hide_border=true&theme=tokyonight&bg_color=0D1117&title_color=4EA8DE&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
